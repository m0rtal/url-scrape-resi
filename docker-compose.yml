version: "3.8"

services:
  url-scrape-resi:
    build: .
    image: ghcr.io/m0rtal/url-scrape-resi:3.0.0
    container_name: url-scrape-resi
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - PROXY_URL=${PROXY_URL:-}
      - MAX_CONCURRENT=2
      - WAIT_AFTER_LOAD_MS=2000
      - TIMEOUT_MS=30000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - resi

networks:
  resi:
    driver: bridge
