version: "3.8"
services:
  url-scrape-resi:
    image: python:3.11-slim-bookworm
    container_name: url-scrape-resi
    restart: unless-stopped
    networks:
      - resi
    ports:
      - "3003:3003"
    shm_size: "1g"
    environment:
      - PORT=3003
      - PROXY_URL=${PROXY_URL:-}
      - BLOCK_MEDIA=True
      - TIMEOUT_MS=30000
      - WAIT_AFTER_LOAD=1500
      - DEBIAN_FRONTEND=noninteractive
    entrypoint:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends chromium chromium-driver fonts-liberation libnss3 libgbm1 libasound2
        pip install --break-system-packages --no-cache-dir fastapi==0.115.0 'uvicorn[standard]==0.32.0' markdownify==0.14.1 httpx==0.27.2
        cd /app
        exec python3 -m uvicorn app:app --host 0.0.0.0 --port 3003 --workers 1 --log-level info
    volumes:
      - ./app.py:/app/app.py:ro

networks:
  resi:
    driver: bridge
