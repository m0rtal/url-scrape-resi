version: "3.8"
services:
  url-scrape-resi:
    image: python:3.11-slim-bookworm
    container_name: url-scrape-resi
    restart: unless-stopped
    networks:
      - resi
    ports:
      - "3003:3003"
    shm_size: "256m"
    environment:
      - PORT=3003
      - PROXY_URL=${PROXY_URL:-}
      - BLOCK_MEDIA=True
      - TIMEOUT_MS=30000
      - WAIT_AFTER_LOAD=1500
      - DEBIAN_FRONTEND=noninteractive
    # Bash entrypoint: apt chromium + pip markdownify + reassemble /app/app.py from chunked env-free base64 chunks.
    entrypoint:
      - bash
      - -c
      - |
        set +e
        apt-get update -qq 2>&1 | tail -2
        apt-get install -y -qq --no-install-recommends chromium chromium-driver fonts-liberation libnss3 libgbm1 libasound2 2>&1 | tail -2
        pip install --break-system-packages --no-cache-dir markdownify==0.14.1 2>&1 | tail -2
        mkdir -p /app
        CHUNK_0="" CHUNK_1="" CHUNK_2="" CHUNK_3="" CHUNK_4="" CHUNK_5="" CHUNK_6="" CHUNK_7="" CHUNK_8="" CHUNK_9="" CHUNK_10="" CHUNK_11="" CHUNK_12="" CHUNK_13="ZV9fID09ICJfX21haW5fXyI6CiAgICBtYWluKCkK"
        printf "%s" "${CHUNK_0}""${CHUNK_1}""${CHUNK_2}""${CHUNK_3}""${CHUNK_4}""${CHUNK_5}""${CHUNK_6}""${CHUNK_7}""${CHUNK_8}""${CHUNK_9}""${CHUNK_10}""${CHUNK_11}""${CHUNK_12}""${CHUNK_13}" | base64 -d > /app/app.py
        chmod 644 /app/app.py
        python3 -c 'import markdownify; print("ok markdownify",markdownify.__version__)'
        wc -l /app/app.py
        cd /app
        exec python3 app.py

networks:
  resi:
    driver: bridge
