version: "3.8"
services:
  url-scrape-resi:
    image: mcr.microsoft.com/playwright/python:v1.55.0-jammy
    container_name: url-scrape-resi
    restart: unless-stopped
    networks:
      - resi
    ports:
      - "3003:3003"
    shm_size: "256m"
    environment:
      - PORT=3003
      - PROXY_URL=${PROXY_URL:-}
      - BLOCK_MEDIA=True
      - TIMEOUT_MS=30000
      - WAIT_AFTER_LOAD=1500
    entrypoint:
      - bash
      - -c
      - |
        set +e
        if ! python3 -c "import fastapi" 2>/dev/null; then
          pip3 install --break-system-packages --quiet --no-cache-dir fastapi==0.115.0 'uvicorn[standard]==0.32.0' markdownify==0.14.1 httpx==0.27.2 2>&1 | tail -2
        fi
        mkdir -p /app
        CHUNK_0="" CHUNK_1="" CHUNK_2="" CHUNK_3="" CHUNK_4="" CHUNK_5="" CHUNK_6="" CHUNK_7="" CHUNK_8="" CHUNK_9="" CHUNK_10="KGYidXJsLXNjcmFwZS1yZXNpIGxpc3RlbmluZyBvbiAwLjAuMC4wOntwb3J0fSAocHJveHk9eyd5ZXMnIGlmIFBST1hZX1VSTCBlbHNlICdubyd9KSIpCiAgICBzcnYuc2VydmVfZm9yZXZlcigpCgoKaWYgX19uYW1lX18gPT0gIl9fbWFpbl9fIjoKICAgIG1haW4oKQo="
        printf "%s" "${CHUNK_0}""${CHUNK_1}""${CHUNK_2}""${CHUNK_3}""${CHUNK_4}""${CHUNK_5}""${CHUNK_6}""${CHUNK_7}""${CHUNK_8}""${CHUNK_9}""${CHUNK_10}" | base64 -d > /app/app.py
        chmod 644 /app/app.py
        cd /app
        exec python3 app.py

networks:
  resi:
    driver: bridge
