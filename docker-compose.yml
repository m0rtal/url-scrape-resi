version: "3.8"
services:
  url-scrape-resi:
    image: python:3.11-slim-bookworm
    container_name: url-scrape-resi
    restart: unless-stopped
    networks:
      - resi
    ports:
      - "3003:3003"
    shm_size: "1g"
    environment:
      - PORT=3003
      - PROXY_URL=${PROXY_URL:-}
      - BLOCK_MEDIA=True
      - TIMEOUT_MS=30000
      - WAIT_AFTER_LOAD=1500
      - DEBIAN_FRONTEND=noninteractive
    command:
      - bash
      - -c
      - |
        set -e; apt-get update -qq && apt-get install -y -qq --no-install-recommends chromium chromium-driver fonts-liberation libnss3 libgbm1 libasound2; pip install --break-system-packages --no-cache-dir fastapi==0.115.0 'uvicorn[standard]==0.32.0' markdownify==0.14.1 httpx==0.27.2; mkdir -p /app; CHUNK_0=$(echo "") CHUNK_1=$(echo "") CHUNK_2=$(echo "") CHUNK_3=$(echo "") CHUNK_4=$(echo "") CHUNK_5=$(echo "") CHUNK_6=$(echo "") CHUNK_7=$(echo "") CHUNK_8=$(echo ""); echo "${CHUNK_0}""${CHUNK_1}""${CHUNK_2}""${CHUNK_3}""${CHUNK_4}""${CHUNK_5}""${CHUNK_6}""${CHUNK_7}""${CHUNK_8}" | base64 -d > /app/app.py; chmod 644 /app/app.py; cd /app; exec python3 -m uvicorn app:app --host 0.0.0.0 --port 3003 --workers 1 --log-level info

networks:
  resi:
    driver: bridge
