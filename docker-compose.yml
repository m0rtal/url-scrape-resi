version: "3.8"
services:
  url-scrape-resi:
    build: .
    image: url-scrape-resi:local
    container_name: url-scrape-resi
    restart: unless-stopped
    networks:
      - resi
    ports:
      - "3003:3003"
    shm_size: "256m"
    mem_limit: 1g
    environment:
      - PORT=3003
      - PROXY_URL=${PROXY_URL:-}
      - BLOCK_MEDIA=True
      - TIMEOUT_MS=30000
      - WAIT_AFTER_LOAD=1500
      - DEBIAN_FRONTEND=noninteractive

networks:
  resi:
    driver: bridge
